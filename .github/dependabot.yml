version: 2

updates:
  # One pnpm lockfile at the workspace root covers every package, so a single
  # entry here updates all of packages/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Types must describe the minimum supported runtime, not a newer Node API.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # React's renderer requires exactly the same runtime version as React.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - minor
          - patch
      # These ship as a matched set. Upgrading the plugin without the parser
      # (or vice versa) breaks the lint run, so a split PR arrives red for
      # reasons that have nothing to do with the change in it.
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      # Everything else dev-only, batched to cut PR noise.
      #
      # Minor and patch only. A grouped PR is all-or-nothing: one breaking
      # major in the batch turns the whole thing red and blocks every safe
      # bump riding along with it. Majors are excluded here so they arrive as
      # single-dependency PRs that can be reviewed, and reverted, on their own.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - '@typescript-eslint/*'
          - 'vitest'
          - '@vitest/*'

  # Templates are shipped as source and have independent manifests. The root
  # pnpm workspace does not include them, so they need their own update entry.
  - package-ecosystem: npm
    directories:
      - /packages/cli/templates/react
      - /packages/cli/templates/vue
      - /packages/cli/templates/sveltekit
      - /packages/cli/templates/angular
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # These ranges follow our coordinated release, not registry updates.
      - dependency-name: '@nearstack-dev/*'
    groups:
      template-maintenance:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Sub-path actions published from one repository (for example
      # github/codeql-action/init and .../analyze) are released together and
      # have to move together, or the mismatched pair fails.
      actions:
        patterns:
          - '*'
